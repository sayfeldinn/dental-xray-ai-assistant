name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repo hygiene: reject binary/model weight commits that bloat clones.
  # This substitutes for branch protection, which is unavailable on a private
  # repo with the free plan (see CONTRIBUTING.md).
  guard:
    name: Repo guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forbid ML weight / archive artifacts in the tree
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(pt|pth|h5|onnx|ckpt|zip|tar|tar\.gz|7z)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Binary artifacts must be published as Release assets, not committed:"
            echo "$bad"
            exit 1
          fi
          echo "OK - no weight/archive artifacts tracked."

      - name: Forbid committed .env files
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Secrets must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "OK - no .env files tracked."

      - name: Forbid leaked Supabase keys in tracked files
        run: |
          set -euo pipefail
          if git grep -n -E 'sb_secret_[A-Za-z0-9_-]{10,}|supabase\.co/[a-z0-9]{20,}' \
              -- ':!*.lock' ':!package-lock.json'; then
            echo "::error::A credential is committed - rotate it in the Supabase dashboard."
            exit 1
          fi
          echo "OK - no obvious credentials in tracked files."

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Syntax check
        run: python -m compileall -q app

      - name: Run tests
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "No tests yet - skipping. Add backend/tests/test_*.py to enable."
          fi
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
